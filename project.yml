name: Budget
options:
  bundleIdPrefix: hu.sajat
  deploymentTarget:
    iOS: "26.0"
targets:
  Budget:
    type: application
    platform: iOS
    sources: [Budget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.sajat.budget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Költségvetés
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
