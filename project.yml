name: Budget
options:
  bundleIdPrefix: hu.sajat
  deploymentTarget:
    iOS: "26.0"
targets:
  Budget:
    type: application
    platform: iOS
    sources: [Budget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.sajat.budget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pocket
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon02 AppIcon03 AppIcon04 AppIcon05 AppIcon06 AppIcon07 AppIcon08"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "A pénzügyi adataid védelméhez."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: BudgetWidget
  BudgetWidget:
    type: app-extension
    platform: iOS
    sources:
      - BudgetWidget
      - Budget/WidgetShared.swift
      - Budget/AddMoneyIntent.swift
    info:
      path: BudgetWidget/Info.plist
      properties:
        CFBundleDisplayName: Pocket
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.sajat.budget.widget
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
