<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Savings</title><style>
:root{color-scheme:dark;--bg:#10131c;--fg:#f5f7ff;--muted:#a1a8bc;--glass:#ffffff0b;--border:#ffffff18;--accent:#a9f6c6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0%,#304c50 0,transparent 45%),radial-gradient(ellipse at 100% 38%,#30284c 0,transparent 50%),var(--bg);background-attachment:fixed;color:var(--fg);font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh}body.light{color-scheme:light;--bg:#eef2f8;--fg:#182338;--muted:#52647a;--glass:#ffffffa0;--border:#22335520;--accent:#176e48;background:radial-gradient(ellipse at top left,#c3ebdc,transparent 60%),var(--bg)}main{max-width:540px;margin:auto;padding:calc(env(safe-area-inset-top) + 32px) 20px 125px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}h1{font-size:36px;letter-spacing:-1.7px;margin:4px 0}h2{font-size:20px;letter-spacing:-.6px;margin:24px 0 12px}p{margin:8px 0}small,.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700}.glass{background:var(--glass);border:1px solid var(--border);border-radius:26px;padding:20px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 12px 40px #00000012}.hero{position:relative;overflow:hidden;padding:26px;background:linear-gradient(135deg,#83e6ba23,#ffffff06);margin-bottom:16px}.balance{font-size:clamp(34px,9vw,54px);font-weight:650;letter-spacing:-2px;margin:13px 0;overflow-wrap:anywhere}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.actions{display:flex;gap:10px;margin-top:22px}.actions button{flex:1}button,input,select{font:inherit}button{border:0;cursor:pointer;color:var(--fg);background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:13px 16px;font-weight:600;transition:transform .18s,background .18s}button:active{transform:scale(.95)}button.primary{background:#a9f6c6;color:#123629;border:0}button.round{border-radius:50%;width:46px;height:46px;padding:0;font-size:25px}.goal{margin:10px 0}.goal strong{font-size:17px}.emoji{font-size:24px;width:48px;height:48px;display:grid;place-items:center;background:var(--glass);border-radius:15px}.grow{flex:1;min-width:0;overflow-wrap:anywhere}.track{height:8px;border-radius:20px;background:#88888830;overflow:hidden;margin:17px 0 10px}.fill{height:100%;background:linear-gradient(90deg,#61cfa0,#c6fbd8);border-radius:20px;animation:bar .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}.screen{animation:appear .32s ease both}@keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(94%,510px);display:flex;justify-content:space-around;gap:3px;padding:8px;border:1px solid var(--border);border-radius:30px;background:#252b37d9;backdrop-filter:blur(35px);-webkit-backdrop-filter:blur(35px);box-shadow:0 10px 35px #0005;z-index:5}body.light nav{background:#ffffffd9}nav button{flex:1;background:transparent;border:0;border-radius:22px;color:var(--muted);padding:10px 2px;font-size:11px}nav button.active{background:#a9f6c625;color:var(--accent)}nav svg{display:block;width:23px;height:23px;margin:0 auto 5px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .glass{padding:16px}.stats strong{display:block;font-size:21px;margin-top:8px}.empty{text-align:center;padding:32px 18px;color:var(--muted)}.txn{padding:13px 0;border-bottom:1px solid var(--border)}.txn:last-child{border:0}.positive{color:var(--accent)}dialog{width:min(92%,460px);max-height:85dvh;overflow:auto;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:28px;padding:24px;box-shadow:0 20px 80px #0008}dialog::backdrop{background:#0007;backdrop-filter:blur(7px)}label{display:block;margin:14px 0 6px;color:var(--muted);font-size:13px}input,select{width:100%;padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--glass);color:var(--fg)}.wide{width:100%;margin-top:15px}.chart{display:flex;align-items:end;gap:8px;height:110px;margin:20px 0 6px}.chart div{flex:1;background:linear-gradient(0deg,#4f8e78,#a9f6c6);border-radius:6px 6px 2px 2px;min-height:3px;animation:appear .5s both}.danger{color:#ff9797}.setting{margin-bottom:10px}.setting button{width:100%;margin-top:10px}#toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);background:#a9f6c6;color:#123629;padding:12px 18px;border-radius:20px;z-index:20;display:none;white-space:nowrap}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><header><div><div class="eyebrow">Personal finance</div><h1 id="heading">Overview</h1></div><button class="round" id="top" aria-label="Add savings goal">+</button></header><div id="view"></div></main><nav id="nav"></nav><dialog id="modal"><form id="form"><div class="row"><h2 id="mt" style="margin:0"></h2><button type="button" id="close" aria-label="Close">×</button></div><div id="fields"></div><button class="primary wide" type="submit">Save</button></form></dialog><div id="toast" role="status"></div><input type="file" id="import" accept="application/json" hidden><script>
const $=id=>document.getElementById(id),KEY='savings-v1';let s={goals:[],tx:[],currency:'HUF',theme:'dark'};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.goals)&&Array.isArray(saved.tx))s={...s,...saved}}catch{}let tab='Overview',submitFn;const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>new Intl.NumberFormat('en-US',{style:'currency',currency:s.currency,maximumFractionDigits:s.currency==='HUF'?0:2}).format(x);const total=()=>s.goals.reduce((a,g)=>a+g.saved,0);const uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);function save(){try{localStorage.setItem(KEY,JSON.stringify(s));render();toast('Saved')}catch{alert('Storage is unavailable. Export a backup before closing.')}}let timer;function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('toast').style.display='none',1800)}const icons=['<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>','<path d="M4 8h16v12H4zM8 8V5h8v3M9 13h6"/>','<path d="M3 12h4l3-7 4 14 3-7h4"/>','<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>'];const tabs=['Overview','Savings','Activity','Settings'];$('nav').innerHTML=tabs.map((t,i)=>`<button data-tab="${t}"><svg viewBox="0 0 24 24">${icons[i]}</svg>${t}</button>`).join('');$('nav').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.tab;render();window.scrollTo(0,0)}};function goalCard(g){let p=Math.min(100,Math.max(0,g.saved/g.target*100));return `<article class="glass goal"><div class="row"><div class="emoji">${esc(g.icon)}</div><div class="grow"><strong>${esc(g.name)}</strong><div class="muted" style="font-size:13px">${money(g.saved)} of ${money(g.target)}</div></div><button data-edit="${esc(g.id)}" aria-label="Edit goal">···</button></div><div class="track"><div class="fill" style="width:${p}%"></div></div><div class="row"><small>${Math.floor(p)}% completed</small><small>${money(Math.max(0,g.target-g.saved))} left</small></div><div class="actions"><button data-add="${esc(g.id)}">+ Add</button><button data-out="${esc(g.id)}">Withdraw</button></div></article>`}function txList(n){return s.tx.length?s.tx.slice(0,n).map(t=>`<div class="row txn"><div class="emoji">${t.amount>0?'↗':'↘'}</div><div class="grow"><strong>${esc(t.name)}</strong><div class="muted" style="font-size:12px">${new Date(t.date).toLocaleDateString()} · ${esc(t.note|| (t.amount>0?'Deposit':'Withdrawal'))}</div></div><strong class="${t.amount>0?'positive':''}">${t.amount>0?'+':'−'}${money(Math.abs(t.amount))}</strong></div>`).join(''):'<div class="empty">No activity yet.</div>'}function render(){document.body.classList.toggle('light',s.theme==='light');$('heading').textContent=tab;$('top').style.visibility=tab==='Settings'?'hidden':'visible';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html='',target=s.goals.reduce((a,g)=>a+g.target,0);if(tab==='Overview'){let vals=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return s.tx.filter(t=>new Date(t.date).toDateString()===d.toDateString()&&t.amount>0).reduce((a,t)=>a+t.amount,0)}),max=Math.max(1,...vals);html=`<div class="glass hero"><div class="eyebrow">Total saved</div><div class="balance">${money(total())}</div><small>${s.goals.length} active goals · ${target?Math.floor(total()/target*100):0}% of target</small><div class="actions"><button class="primary" data-action="deposit">＋ Add money</button><button data-action="withdraw">Withdraw</button></div></div><div class="stats"><div class="glass"><small>Total target</small><strong>${money(target)}</strong></div><div class="glass"><small>Remaining</small><strong>${money(s.goals.reduce((a,g)=>a+Math.max(0,g.target-g.saved),0))}</strong></div></div><h2>Saving activity</h2><div class="glass"><small>Deposits · last 7 days</small><div class="chart">${vals.map(v=>`<div style="height:${Math.max(3,v/max*100)}%" title="${money(v)}"></div>`).join('')}</div><div class="row"><small>6 days ago</small><small>Today</small></div></div><div class="row"><h2>Your goals</h2><button data-action="goals">See all</button></div>${s.goals.slice(0,2).map(goalCard).join('')||'<div class="glass empty">Start with your first savings goal.<br><button class="primary wide" data-action="new">Create a goal</button></div>'}`;}if(tab==='Savings')html=`<div class="glass hero"><small>Total saved</small><div class="balance">${money(total())}</div><small>Make your next big thing happen.</small></div>${s.goals.map(goalCard).join('')||'<div class="glass empty">No goals yet. Create one to begin.</div>'}<button class="primary wide" data-action="new">＋ New savings goal</button>`;if(tab==='Activity')html=`<div class="glass">${txList(100000)}</div>`;if(tab==='Settings')html=`<div class="glass setting"><h2 style="margin-top:0">Appearance</h2><label>Theme</label><select id="theme"><option value="dark">Dark glass</option><option value="light">Light glass</option></select><label>Currency</label><select id="currency">${['HUF','EUR','USD','GBP'].map(c=>`<option>${c}</option>`).join('')}</select><small>Currency changes the label only, not exchange rates.</small></div><div class="glass setting"><h2 style="margin-top:0">Your data</h2><small>Stored on this device. No account or cloud sync.</small><button data-action="export">Export backup</button><button data-action="import">Import backup</button><button class="danger" data-action="reset">Reset all data</button></div><div class="glass"><h2 style="margin-top:0">Savings</h2><small>Version 1.0 · Private on-device storage</small><p>Install from Safari using Share → Add to Home Screen.</p></div>`;$('view').innerHTML=`<div class="screen">${html}</div>`;if(tab==='Settings'){$('theme').value=s.theme;$('currency').value=s.currency;$('theme').onchange=e=>{s.theme=e.target.value;save()};$('currency').onchange=e=>{s.currency=e.target.value;save()}}}function modal(title,fields,fn){$('mt').textContent=title;$('fields').innerHTML=fields;submitFn=fn;$('modal').showModal()}$('close').onclick=()=>$('modal').close();$('form').onsubmit=e=>{e.preventDefault();if(submitFn(new FormData(e.target))!==false){$('modal').close();save()}};function newGoal(g){modal(g?'Edit goal':'New savings goal',`<label>Name</label><input name="name" required maxlength="60" value="${esc(g?.name||'')}" placeholder="New PC, holiday…"><label>Icon</label><select name="icon">${['💰','✈️','🖥️','🚗','🏠','🎯','🎁','🛡️','📱'].map(i=>`<option ${g?.icon===i?'selected':''}>${i}</option>`).join('')}</select><label>Target amount</label><input name="target" type="number" min="1" max="1000000000000" step="0.01" required value="${g?.target||''}" inputmode="decimal">${g?'<button type="button" class="danger wide" id="deleteGoal">Delete goal</button>':''}`,f=>{let name=f.get('name').trim();if(!name)return false;let data={name,icon:f.get('icon'),target:Number(f.get('target'))};if(g)Object.assign(g,data);else s.goals.push({...data,id:uid(),saved:0})});if(g)$('deleteGoal').onclick=()=>{if(confirm('Delete this goal and its transaction history?')){s.goals=s.goals.filter(x=>x.id!==g.id);s.tx=s.tx.filter(x=>x.goal!==g.id);$('modal').close();save()}}}function transaction(id,negative){if(!s.goals.length){newGoal();return}modal(negative?'Withdraw money':'Add money',`<label>Goal</label><select name="goal">${s.goals.map(g=>`<option value="${esc(g.id)}" ${g.id===id?'selected':''}>${esc(g.name)}</option>`).join('')}</select><label>Amount</label><input name="amount" type="number" min="0.01" max="1000000000000" step="0.01" required inputmode="decimal" placeholder="0"><label>Note (optional)</label><input name="note" maxlength="120" placeholder="Salary, gift…">`,f=>{let g=s.goals.find(x=>x.id===f.get('goal')),a=Number(f.get('amount'))*(negative?-1:1);if(g.saved+a<0){alert('Not enough savings in this goal.');return false}g.saved=Math.round((g.saved+a)*100)/100;s.tx.unshift({goal:g.id,name:g.name,amount:a,note:f.get('note'),date:new Date().toISOString()})})}$('top').onclick=()=>newGoal();$('view').onclick=e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.edit)newGoal(s.goals.find(g=>g.id===d.edit));if(d.add)transaction(d.add,false);if(d.out)transaction(d.out,true);switch(d.action){case'new':newGoal();break;case'goals':tab='Savings';render();break;case'deposit':transaction(null,false);break;case'withdraw':transaction(null,true);break;case'export':{let u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='savings-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);break}case'import':$('import').click();break;case'reset':if(confirm('Permanently erase all savings data?')){s.goals=[];s.tx=[];save()}break}};$('import').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.goals)||!Array.isArray(x.tx)||!x.goals.every(g=>typeof g.id==='string'&&typeof g.name==='string'&&typeof g.icon==='string'&&Number.isFinite(g.target)&&g.target>0&&Number.isFinite(g.saved)&&g.saved>=0)||!x.tx.every(t=>typeof t.name==='string'&&Number.isFinite(t.amount)&&Number.isFinite(Date.parse(t.date)))||!['HUF','EUR','USD','GBP'].includes(x.currency)||!['dark','light'].includes(x.theme))throw Error();if(confirm('Replace current data with this backup?')){s=x;save()}}catch{alert('Invalid backup file.')}e.target.value=''};render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
