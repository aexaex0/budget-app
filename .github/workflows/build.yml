name: Build IPA
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode projekt generálása
        run: brew install xcodegen && xcodegen generate
      - name: Fordítás (aláírás nélkül)
        run: |
          set -o pipefail
          xcodebuild -project Budget.xcodeproj -scheme Budget \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log
      - name: Hibák kiírása
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -30 | while IFS= read -r l; do echo "::error::$l"; done
      - name: IPA csomagolás
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Budget.app Payload/
          zip -r Budget.ipa Payload
      - name: Kísérleti IPA App Group-pal (widget adatokhoz)
        continue-on-error: true
        run: |
          mkdir -p groups/Payload
          cp -R build/Build/Products/Release-iphoneos/Budget.app groups/Payload/
          codesign -f -s - --entitlements Config/BudgetWidget.entitlements groups/Payload/Budget.app/PlugIns/BudgetWidget.appex
          codesign -f -s - --entitlements Config/Budget.entitlements groups/Payload/Budget.app
          cd groups && zip -r ../Budget-groups.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Budget-ipa
          path: Budget.ipa
      - name: Állandó letöltési link (Release)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          EXTRA=""; [ -f Budget-groups.ipa ] && EXTRA="Budget-groups.ipa"
          gh release create latest Budget.ipa $EXTRA --title "Pocket (legújabb)" \
            --notes "Automatikus build: ${{ github.sha }}" --target ${{ github.sha }}
